name: Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start app and wait for healthy
        uses: AxeForging/tacomex-8bit-shop/.github/actions/start-app@main
        with:
          health-timeout: "120"
          checkout: "false"

      - name: Ping health endpoint
        run: |
          echo "=== Health ==="
          curl -sf http://localhost:3001/health | python3 -m json.tool

      - name: Ping API root
        run: |
          echo "=== API Root ==="
          curl -sf http://localhost:3001/ | python3 -m json.tool

      - name: Ping Swagger docs
        run: |
          echo "=== Swagger JSON ==="
          curl -sf http://localhost:3001/docs/json | python3 -m json.tool | head -30

      - name: List products
        run: |
          echo "=== Products ==="
          curl -sf http://localhost:3001/api/products?limit=3 | python3 -m json.tool

      - name: List categories
        run: |
          echo "=== Categories ==="
          curl -sf http://localhost:3001/api/categories | python3 -m json.tool

      - name: List active promotions
        run: |
          echo "=== Active Promotions ==="
          curl -sf http://localhost:3001/api/promotions/active | python3 -m json.tool

      - name: Login and place an order
        run: |
          echo "=== Login ==="
          TOKEN=$(curl -sf http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"customer@tacomex.com","password":"pass123"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "Got token: ${TOKEN:0:20}..."

          echo "=== Place Order ==="
          curl -sf http://localhost:3001/api/orders \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"items":[{"product_id":1,"quantity":2}],"delivery_address":"123 CI St"}' \
            | python3 -m json.tool

      - name: Ping frontend
        run: |
          echo "=== Frontend ==="
          curl -sf -o /dev/null -w "HTTP %{http_code} — %{size_download} bytes\n" http://localhost:5173

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100
