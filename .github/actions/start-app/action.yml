name: "Start TacoMex App"
description: "Starts the TacoMex full stack via Docker Compose and waits for the health check to pass. Works both inside the TacoMex repo and from external repos — when used externally the action clones the app source automatically."

inputs:
  health-timeout:
    description: "Max seconds to wait for the app to become healthy"
    required: false
    default: "180"
  health-url:
    description: "Health endpoint URL to poll"
    required: false
    default: "http://localhost:3001/health"
  docker-compose-file:
    description: "Path to docker-compose file"
    required: false
    default: "docker-compose.yaml"
  app-ref:
    description: "Git ref (branch/tag/sha) of the TacoMex repo to checkout (only used when checkout is true)"
    required: false
    default: "main"
  checkout:
    description: "Clone the TacoMex repo automatically (set to false when running inside the TacoMex repo itself)"
    required: false
    default: "true"
  install-frontend-deps:
    description: "Install frontend deps on the host and restart the container (needed for Playwright)"
    required: false
    default: "false"
  frontend-dir:
    description: "Relative path to frontend directory (used when install-frontend-deps is true)"
    required: false
    default: "frontend"
  # Rate limiting — set low values to simulate throttling in tests.
  # Leave empty to use the defaults (10 000 / 1 000 / 1 000 in dev).
  rate-limit-global:
    description: "RATE_LIMIT_GLOBAL — max requests per 15 min globally (e.g. set to 10 to test throttling)"
    required: false
    default: ""
  rate-limit-auth:
    description: "RATE_LIMIT_AUTH — max login attempts per 15 min (e.g. set to 3 to test lockout)"
    required: false
    default: ""
  rate-limit-orders:
    description: "RATE_LIMIT_ORDERS — max orders per hour (e.g. set to 2 to test order throttling)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout TacoMex repo
      if: inputs.checkout == 'true'
      uses: actions/checkout@v4
      with:
        repository: AxeForging/tacomex-8bit-shop
        ref: ${{ inputs.app-ref }}
        path: .tacomex-app

    - name: Resolve app directory
      id: appdir
      shell: bash
      run: |
        if [ "${{ inputs.checkout }}" = "true" ]; then
          echo "path=.tacomex-app" >> "$GITHUB_OUTPUT"
        else
          echo "path=." >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: docker-${{ runner.os }}-${{ hashFiles('**/Dockerfile', '**/package-lock.json') }}
        restore-keys: docker-${{ runner.os }}-

    - name: Pull base images
      shell: bash
      run: |
        docker pull node:20-alpine &
        docker pull postgres:15-alpine &
        docker pull redis:7-alpine &
        docker pull rabbitmq:3.13-management-alpine &
        wait

    - name: Start services
      shell: bash
      working-directory: ${{ steps.appdir.outputs.path }}
      env:
        RATE_LIMIT_GLOBAL: ${{ inputs.rate-limit-global }}
        RATE_LIMIT_AUTH: ${{ inputs.rate-limit-auth }}
        RATE_LIMIT_ORDERS: ${{ inputs.rate-limit-orders }}
      run: docker compose -f ${{ inputs.docker-compose-file }} up --build -d

    - name: Wait for app to be ready
      shell: bash
      working-directory: ${{ steps.appdir.outputs.path }}
      run: |
        echo "Waiting for ${{ inputs.health-url }} (timeout: ${{ inputs.health-timeout }}s)..."
        elapsed=0
        until curl -sf "${{ inputs.health-url }}" > /dev/null 2>&1; do
          if [ "$elapsed" -ge "${{ inputs.health-timeout }}" ]; then
            echo "::error::Timed out after ${elapsed}s waiting for health check"
            echo "--- Container status ---"
            docker compose -f ${{ inputs.docker-compose-file }} ps
            echo "--- Backend logs ---"
            docker compose -f ${{ inputs.docker-compose-file }} logs backend --tail=80
            echo "--- Postgres logs ---"
            docker compose -f ${{ inputs.docker-compose-file }} logs postgres --tail=30
            exit 1
          fi
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "App is healthy after ${elapsed}s"
        curl -sf "${{ inputs.health-url }}" | python3 -m json.tool

    - name: Install frontend deps on host
      if: inputs.install-frontend-deps == 'true'
      shell: bash
      working-directory: ${{ steps.appdir.outputs.path }}/${{ inputs.frontend-dir }}
      run: |
        sudo rm -rf node_modules
        npm ci

    - name: Restart frontend to pick up fresh deps
      if: inputs.install-frontend-deps == 'true'
      shell: bash
      working-directory: ${{ steps.appdir.outputs.path }}
      run: docker compose -f ${{ inputs.docker-compose-file }} restart frontend && sleep 5
