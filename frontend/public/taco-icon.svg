<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Taco shell - pixel art style -->
  <rect x="8" y="32" width="48" height="4" fill="#F4A460"/>
  <rect x="12" y="28" width="40" height="4" fill="#F4A460"/>
  <rect x="16" y="24" width="32" height="4" fill="#F4A460"/>
  <rect x="20" y="20" width="24" height="4" fill="#F4A460"/>
  <rect x="24" y="16" width="16" height="4" fill="#F4A460"/>

  <!-- Lettuce - green pixels -->
  <rect x="16" y="28" width="4" height="4" fill="#228B22"/>
  <rect x="24" y="24" width="4" height="4" fill="#228B22"/>
  <rect x="36" y="24" width="4" height="4" fill="#228B22"/>
  <rect x="44" y="28" width="4" height="4" fill="#228B22"/>

  <!-- Meat - brown pixels -->
  <rect x="20" y="28" width="4" height="4" fill="#8B4513"/>
  <rect x="28" y="24" width="8" height="4" fill="#8B4513"/>
  <rect x="40" y="28" width="4" height="4" fill="#8B4513"/>

  <!-- Cheese - yellow pixels -->
  <rect x="28" y="20" width="4" height="4" fill="#FFD700"/>
  <rect x="32" y="20" width="4" height="4" fill="#FFD700"/>

  <!-- Tomato - red pixels -->
  <rect x="24" y="20" width="4" height="4" fill="#FF6347"/>
  <rect x="36" y="20" width="4" height="4" fill="#FF6347"/>

  <!-- Bottom of shell -->
  <rect x="4" y="36" width="56" height="4" fill="#DEB887"/>
  <rect x="8" y="40" width="48" height="4" fill="#DEB887"/>
  <rect x="16" y="44" width="32" height="4" fill="#DEB887"/>
  <rect x="24" y="48" width="16" height="4" fill="#DEB887"/>
</svg>
